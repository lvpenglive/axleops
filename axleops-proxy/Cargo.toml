[package]
name = "axleops-proxy"
version = "0.4.1"
edition = "2021"
description = "AxleOps boundary proxy between admin and agents"
authors = ["AxleOps"]
license = "MIT"
repository = "https://github.com/lvpenglive/axleops"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
thiserror = "2"
