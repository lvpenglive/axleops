[package]
name = "axleops-agent"
version = "0.4.1"
edition = "2021"
description = "AxleOps machine agent for JAR process lifecycle"
authors = ["AxleOps"]
license = "MIT"
repository = "https://github.com/lvpenglive/axleops"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
encoding_rs = "0.8"
ureq = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
